<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d10e68">
  <title>PayMe · Little Mixxy</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="boot-wrap">
    <p class="boot">Opening PayMe…</p>
  </div>
  <script>
    if (location.protocol === 'file:') {
      var app = document.getElementById('app');
      app.innerHTML = '<p class="boot">This file cannot run PayMe by itself.<br>Open <a href="http://localhost:4173/">http://localhost:4173</a></p>';
      location.replace('http://localhost:4173/');
    }
  </script>
  <script src="/app.js" onerror="if(location.protocol!=='file:'){document.getElementById('app').innerHTML='<p class=boot>PayMe could not start. Open <a href=http://localhost:4173/>http://localhost:4173</a> while <code>node server.js</code> is running.</p>'}"></script>
</body>
</html>
